<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lofi Stream - Minimaliste</title>
    <!-- Link to premium typography (Outfit font) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* CSS Variable definitions for visual tokens */
        :root {
            --bg-color: #05050a;
            --text-color: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-color: #ff6b6b;
            --accent-glow: rgba(255, 107, 107, 0.15);
            --glow-color-1: rgba(255, 121, 198, 0.2);
            --glow-color-2: rgba(189, 147, 249, 0.2);
            --glow-color-3: rgba(139, 233, 253, 0.2);
            --glow-opacity: 1;
            --font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            padding: 24px;
        }

        /* Ambient animated color-shifting glow behind the player */
        .ambient-glow {
            position: absolute;
            width: 70vw;
            height: 70vh;
            max-width: 800px;
            max-height: 500px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, var(--glow-color-1) 0%, var(--glow-color-2) 40%, var(--glow-color-3) 70%, transparent 100%);
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
            opacity: var(--glow-opacity);
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            animation: pulseGlow 15s infinite alternate ease-in-out, rotateHue 25s infinite linear;
        }

        @keyframes pulseGlow {
            0% {
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                transform: translate(-50%, -50%) scale(1.15);
            }
        }

        @keyframes rotateHue {
            0% {
                filter: blur(100px) hue-rotate(0deg);
            }
            100% {
                filter: blur(100px) hue-rotate(360deg);
            }
        }

        /* Main structure centering content */
        .wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            opacity: 0;
            transform: translateY(15px);
            animation: fadeIn 1.2s forwards cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Minimal Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 8px;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 107, 107, 0.08);
            padding: 6px 12px;
            border-radius: 100px;
            border: 1px solid rgba(255, 107, 107, 0.15);
            backdrop-filter: blur(4px);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--accent-color);
            animation: blink 2s infinite ease-in-out;
        }

        .status-label {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-transform: uppercase;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        h1 {
            font-size: 1.15rem;
            font-weight: 400;
            letter-spacing: 0.8px;
            color: var(--text-color);
            opacity: 0.9;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Video Player Frame and Border Styling */
        .player-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .player-container:hover {
            transform: scale(1.008);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Minimalist Footer controls */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            transition: opacity 0.3s ease;
        }

        .footer a {
            color: var(--text-color);
            text-decoration: none;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.2);
            transition: border-color 0.2s, color 0.2s;
        }

        .footer a:hover {
            color: #fff;
            border-bottom-color: #fff;
        }

        /* Premium Minimalist Toggle Switch */
        .switch-container {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
            padding: 4px 8px;
            border-radius: 8px;
            transition: background-color 0.2s, color 0.2s;
        }

        .switch-container:hover {
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text-color);
        }

        .switch-container span {
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 32px;
            height: 18px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 100px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 10px;
            width: 10px;
            left: 3px;
            bottom: 3px;
            background-color: var(--text-secondary);
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.15);
        }

        input:checked + .slider:before {
            transform: translateX(14px);
            background-color: #fff;
        }

        /* Responsive refinements */
        @media (max-width: 640px) {
            body {
                padding: 16px;
            }
            .wrapper {
                gap: 16px;
            }
            h1 {
                font-size: 1rem;
            }
            .footer {
                flex-direction: column;
                gap: 12px;
                align-items: center;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient glowing effect -->
    <div class="ambient-glow" id="glow"></div>

    <div class="wrapper">
        <!-- Header -->
        <header class="header">
            <div class="title-group">
                <div class="status-badge">
                    <span class="status-dot"></span>
                    <span class="status-label">Live</span>
                </div>
                <h1>Lofi Girl Radio</h1>
            </div>
        </header>

        <!-- Player Container -->
        <main class="player-container">
            <!-- 
              YouTube embed options used:
              - autoplay=1: Try to autoplay standard media (mute is needed for browser policies)
              - mute=1: Required to auto-play under modern browser autoplays
              - modestbranding=1: Minimize YouTube branding
              - rel=0: Show only related videos from the same channel
            -->
            <iframe 
                src="https://www.youtube.com/embed/oCyaoMvTnsM?autoplay=1&mute=1&modestbranding=1&rel=0" 
                title="Lecteur Live Lofi Girl"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </main>

        <!-- Footer / Controls -->
        <footer class="footer">
            <div>
                Source : <a href="https://www.youtube.com/watch?v=oCyaoMvTnsM" target="_blank">YouTube Live</a>
            </div>
            
            <div class="switch-container" id="glow-container">
                <span>Lumière d'ambiance</span>
                <label class="switch">
                    <input type="checkbox" id="glow-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </footer>
    </div>

    <script>
        const glowContainer = document.getElementById('glow-container');
        const glowToggle = document.getElementById('glow-toggle');
        const glow = document.getElementById('glow');

        // Toggle state handler
        function updateGlowState(isEnabled) {
            if (isEnabled) {
                glow.style.opacity = '1';
            } else {
                glow.style.opacity = '0';
            }
        }

        // Add event listener to the whole container for better tap targets
        glowContainer.addEventListener('click', (e) => {
            // Prevent double-toggling if checkbox is clicked directly
            if (e.target !== glowToggle) {
                glowToggle.checked = !glowToggle.checked;
                updateGlowState(glowToggle.checked);
            }
        });

        glowToggle.addEventListener('change', () => {
            updateGlowState(glowToggle.checked);
        });
    </script>
</body>
</html>
