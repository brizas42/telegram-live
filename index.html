<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Football Live</title>

    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }

        .app {
            width: 100%;
            min-height: 100vh;
            background: #0f0f0f;
        }

        .header {
            padding: 15px;
            background: #111;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: black;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .info {
            padding: 20px;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .live {
            display: inline-block;
            background: #e53935;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        .description {
            margin-top: 15px;
            color: #aaa;
            line-height: 1.5;
        }

    </style>

</head>

<body>

<div class="app">

    <div class="header">
        ⚽ Football Live
    </div>

    <div class="video-container">

        <iframe
            src="https://www.youtube.com/embed/oCyaoMvTnsM"
            title="YouTube Live"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>

    </div>

    <div class="info">

        <div class="title">
            🔴 Match en direct
        </div>

        <span class="live">
            LIVE
        </span>

        <div class="description">
            Regardez le direct depuis Telegram.
        </div>

    </div>

</div>

<script>

    const tg = window.Telegram.WebApp;

    // Initialise la Mini-App
    tg.ready();

    // Utilise toute la hauteur disponible
    tg.expand();

</script>

</body>

</html>
